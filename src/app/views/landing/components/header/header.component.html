<header class="site-header" [class.site-header--scrolled]="isFixed">
  <div class="header-inner">
    <a routerLink="/" (click)="hidemenu()" class="header-brand" aria-label="Maykconsulting, accueil">
      <img src="assets/images/landing/lOGO_d/logo.png" alt="" />
      <span>Maykconsulting</span>
    </a>

    <nav class="desktop-nav" aria-label="Navigation principale">
      <a href="#" scrollTo="intro-wrap">Accueil</a>
      <a href="#" scrollTo="features-wrap">Services</a>
      <a href="#" scrollTo="pricing-wrap">Tarifs</a>
      <a href="#" scrollTo="contacts-wrap">Contact</a>
    </nav>

    <div class="desktop-actions">
      <a routerLink="/login" class="login-link">Se connecter</a>
      <a routerLink="/register" class="header-cta">Commencer</a>
    </div>

    <button type="button" class="menu-button" (click)="isCollapsed = !isCollapsed" [attr.aria-expanded]="!isCollapsed" aria-controls="mobile-navigation" aria-label="Ouvrir le menu">
      <mat-icon>{{ isCollapsed ? 'menu' : 'close' }}</mat-icon>
    </button>
  </div>

  <nav id="mobile-navigation" class="mobile-nav" [ngbCollapse]="isCollapsed" aria-label="Navigation mobile">
    <a href="#" scrollTo="intro-wrap" (click)="hidemenu()">Accueil</a>
    <a href="#" scrollTo="features-wrap" (click)="hidemenu()">Services</a>
    <a href="#" scrollTo="pricing-wrap" (click)="hidemenu()">Tarifs</a>
    <a href="#" scrollTo="contacts-wrap" (click)="hidemenu()">Contact</a>
    <a routerLink="/login" (click)="hidemenu()">Se connecter</a>
    <a routerLink="/register" (click)="hidemenu()" class="mobile-cta">Commencer mon projet</a>
  </nav>
</header>
